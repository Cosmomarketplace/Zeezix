<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Zeezix Swim</title>
<!-- YouTube Playables SDK (loads only inside the Playables environment; otherwise script 404s and bridge no-ops). -->
<script src="https://www.youtube.com/game_api/v1" onerror="window.__ytGameLoadFailed=true"></script>
<style>
  html,body{margin:0;padding:0;background:#5fbcf0;overflow:hidden;
    font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;height:100%;min-height:100svh;width:100%;}
  body{height:100svh;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#5fbcf0;}
  #probe{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;}
  /* Home button visible during gameplay */
  #homeFab{position:fixed;top:calc(10px + env(safe-area-inset-top,0));left:10px;width:46px;height:46px;
    border-radius:999px;background:rgba(255,255,255,.92);color:#222;border:none;font-size:20px;
    cursor:pointer;z-index:10;box-shadow:0 2px 0 rgba(0,0,0,.15);}
  #homeFab:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.15);}
  #muteBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0));right:10px;width:46px;height:46px;border-radius:999px;
           background:rgba(255,255,255,.9);border:none;font-size:20px;cursor:pointer;z-index:10;}
  .hud{position:fixed;top:calc(70px + env(safe-area-inset-top,0));left:14px;right:14px;display:flex;justify-content:space-between;
       pointer-events:none;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);
       font-size:22px;z-index:5;}
  .hud .pill{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .hud svg{width:20px;height:20px;}
  #stopBtn{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0));display:none;
    background:rgba(255,255,255,.92);color:#5B2D9B;border:none;border-radius:999px;padding:12px 18px;
    font-weight:900;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;z-index:10;}
  #stopBtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn{pointer-events:auto;background:#fff;color:#333;border:none;border-radius:999px;
       padding:10px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15);
       cursor:pointer;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
           justify-content:center;flex-direction:column;color:#fff;text-align:center;z-index:20;
           padding:20px;}
  .overlay h1{font-size:44px;margin:0 0 8px;text-shadow:0 4px 0 rgba(0,0,0,.3);}
  .overlay p{font-size:20px;margin:6px 0 18px;opacity:.95;}
  .overlay .big{font-size:34px;background:#fff;color:#5B2D9B;padding:18px 30px;border-radius:999px;
       border:none;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);}
  .overlay .big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .resetLink{margin-top:6px;background:transparent;border:none;color:rgba(255,255,255,.55);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 10px;}
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0));color:#fff;
        background:rgba(0,0,0,.35);padding:10px 16px;border-radius:999px;font-size:16px;z-index:5;display:none;pointer-events:none;}
</style>
</head>
<body>
<div id="probe"></div>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="homeFab" aria-label="All games (Zeezix)">⭐</button>
<div class="hud">
  <div class="pill">⭐ <span id="stars">0</span></div>
  <div class="pill"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="2"/><circle cx="7" cy="7" r="2" fill="#fff"/></svg><span id="bubs">0</span></div>
</div>
<button id="muteBtn" aria-label="Mute">🔊</button>
<button id="stopBtn" aria-label="Stop and swim home">■ Stop</button>
<div class="hint" id="hint">Hold to swim up</div>

<div id="startOverlay" class="overlay">
  <h1>Zeezix Swim</h1>
  <p>Hold to swim up.<br>Let go to drift down.</p>
  <button class="big" id="startBtn">▶ Play</button>
  <p style="font-size:14px;opacity:.8;margin-top:14px;">Stars: <span id="lifetime">0</span> · Best: <span id="best">0</span></p>
  <button id="resetThisGame" class="resetLink">⚙ Parents: reset this game</button>
</div>

<div id="endOverlay" class="overlay" style="display:none">
  <h1>Ta-da!</h1>
  <p id="endMsg">Home sweet home!</p>
  <p>⭐ <strong><span id="finalStars">0</span></strong> &nbsp; ○ <strong><span id="finalBubs">0</span></strong></p>
  <p id="bestMsg" style="display:none">🎉 New best!</p>
  <button class="big" id="againBtn">▶ Swim Again</button>
  <button class="btn" id="homeBtn" style="margin-top:14px">🏠 Home</button>
</div>

<script>
/* =================================================================
   Zeezix Swim — single-file HTML5 game for YouTube Playables.
   No external assets. No network calls. No lives, no fail state.
   ================================================================= */

/* ----------------------------------------------------------------
   YouTube Playables SDK Bridge
   Safely wraps ytgame.* APIs. No-ops if SDK is absent or fails to
   load, so the game still plays on any host (Netlify, file://, etc.)
   ---------------------------------------------------------------- */
const SAVE_FALLBACK_KEY = 'zeezix_swim_v1';
const YTGame = (() => {
  const hasSdk = typeof ytgame !== 'undefined';
  const inPlayables = hasSdk && !!ytgame.IN_PLAYABLES_ENV;
  const safe = (fn) => { try { return fn(); } catch(e){ return undefined; } };
  return {
    hasSdk, inPlayables,
    firstFrameReady(){ if(hasSdk) safe(()=>ytgame.game.firstFrameReady()); },
    gameReady(){ if(hasSdk) safe(()=>ytgame.game.gameReady()); },
    saveData(obj){
      const s = JSON.stringify(obj);
      if(inPlayables){ safe(()=>ytgame.game.saveData(s)); }
      try{ localStorage.setItem(SAVE_FALLBACK_KEY, s); }catch(e){}
    },
    async loadData(fallback){
      if(inPlayables){
        try{ const s = await ytgame.game.loadData(); if(s) return JSON.parse(s); }catch(e){}
      }
      try{ const s = localStorage.getItem(SAVE_FALLBACK_KEY); if(s) return JSON.parse(s); }catch(e){}
      return fallback;
    },
    sendScore(value){
      if(inPlayables && typeof value === 'number' && isFinite(value)){
        safe(()=>ytgame.engagement.sendScore({value: Math.floor(value)}));
      }
    },
    onPause(cb){
      if(hasSdk) safe(()=>ytgame.system.onPause(cb));
      window.addEventListener('blur', cb);
      document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cb(); });
    },
    onResume(cb){
      if(hasSdk) safe(()=>ytgame.system.onResume(cb));
      window.addEventListener('focus', cb);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cb(); });
    },
    initialAudioEnabled(){
      if(hasSdk){ const v = safe(()=>ytgame.system.isAudioEnabled()); if(typeof v === 'boolean') return v; }
      return true;
    },
    onAudioChange(cb){
      if(hasSdk) safe(()=>ytgame.system.onAudioEnabledChange(cb));
    },
    logError(msg){ if(hasSdk) safe(()=>ytgame.health.logError()); if(msg) console.warn('[swim]', msg); },
  };
})();
window.addEventListener('error', e => YTGame.logError(e && e.message));

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const probe = document.getElementById('probe');
const INK = '#2d2a26';

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2), SAFE_TOP = 0;
let bg = {bubbles:[], hills:[]};
function rnd(a,b){ return a + Math.random()*(b-a); }
function sandHeight(){ return Math.max(36, Math.min(80, H*0.1)); }
function buildBg(){
  bg.bubbles = []; bg.hills = [];
  for(let i=0;i<16;i++) bg.bubbles.push({x:rnd(0,W), y:rnd(0,H), r:rnd(2,6), v:rnd(12,30)});
  for(let i=0;i<10;i++) bg.hills.push({x:i*220, r:rnd(50,120), c:['#8ED0F5','#7CC4EE','#9BD8F7'][i%3]});
}
function resize(){
  const vv = window.visualViewport;
  W = window.innerWidth;
  // Use visualViewport.height when available (iOS Safari) so we stay inside the actually-visible area.
  H = vv ? Math.round(vv.height) : window.innerHeight;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SAFE_TOP = parseFloat(getComputedStyle(probe).paddingTop) || 0;
  buildBg();
  // Keep Zeezix on screen if the viewport changes (iOS toolbars). try/catch: zz is a `let` declared below.
  try { if(typeof zz === 'object' && zz){ zz.x = W*0.28; zz.y = Math.min(zz.y, H - sandHeight() - zzR()); } } catch(e){ /* not yet declared — fine */ }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
resize();

/* ---------- Audio (WebAudio, generated on the fly) ---------- */
let audioCtx = null, muted = false;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function blip(freq, dur, type='sine', vol=0.18, delay=0){
  if(!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function boingSound(){
  if(!audioCtx || muted) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(220, t0);
  o.frequency.exponentialRampToValueAtTime(110, t0+0.08);
  o.frequency.exponentialRampToValueAtTime(330, t0+0.22);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.2, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
  o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+0.32);
}
function starSound(){ [784,1046,1318].forEach((f,i)=>blip(f,0.14,'triangle',0.16,i*0.05)); }
function bubbleSound(){ blip(900,0.08,'sine',0.12); blip(1400,0.1,'sine',0.08,0.05); }
function tadaSound(){ [523,659,784,1046,1318].forEach((f,i)=>blip(f,0.24,'triangle',0.18,i*0.1)); }

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

/* ---------- Persistence (Playables saveData + localStorage fallback) ---------- */
let save = {stars:0, best:0, runs:0};
function saveData(){ YTGame.saveData(save); }
async function bootSave(){
  const loaded = await YTGame.loadData({});
  save = Object.assign({stars:0, best:0, runs:0}, loaded || {});
  refreshMenu();
}
function refreshMenu(){
  document.getElementById('lifetime').textContent = save.stars;
  document.getElementById('best').textContent = save.best;
}

/* ---------- Game state ---------- */
const DUR = 90;            // relaxed swim length in seconds, then "swim home"
let state = 'menu';        // 'menu' | 'play' | 'over'
let paused = false, t = 0, lastDt = 0.016;
let hold = false, elapsed = 0, speed = 150, scroll = 0;
let zz = {x:0, y:0, vy:0, tilt:0, squash:0, bump:0};
let pillars = [], items = [], parts = [], home = null, nextPillarX = 0;
let starsRun = 0, bubsRun = 0, ended = false, spawned = 0;
function zzR(){ return Math.max(22, Math.min(36, Math.min(W,H)*0.06)); }
function gapH(){ return Math.max(150, Math.min(320, H*0.42)); }
function pillarW(){ return Math.max(40, Math.min(80, W*0.09)); }
function pillarGap(){ return Math.max(300, Math.min(520, W*0.6)); }
function topLimit(){ return SAFE_TOP + 64; }

function resetRun(){
  zz = {x:W*0.28, y:H*0.45, vy:0, tilt:0, squash:0, bump:0};
  pillars=[]; items=[]; parts=[]; home=null;
  elapsed=0; speed=150; scroll=0; starsRun=0; bubsRun=0; ended=false; hold=false; spawned=0;
  nextPillarX = W + 120;
  document.getElementById('stars').textContent = 0;
  document.getElementById('bubs').textContent = 0;
}
function startGame(){
  ensureAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  resetRun();
  state='play';
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('endOverlay').style.display='none';
  document.getElementById('stopBtn').style.display='block';
  const hint = document.getElementById('hint'); hint.style.display='block';
  setTimeout(()=>{ hint.style.display='none'; }, 3500);
}
function endRun(msg){
  if(state!=='play' || ended) return;
  ended = true; state='over'; hold=false;
  save.stars += starsRun; save.runs++;
  const isBest = starsRun > (save.best||0);
  if(isBest) save.best = starsRun;
  saveData();
  YTGame.sendScore(save.stars);
  tadaSound();
  document.getElementById('finalStars').textContent = starsRun;
  document.getElementById('finalBubs').textContent = bubsRun;
  document.getElementById('endMsg').textContent = msg;
  document.getElementById('bestMsg').style.display = (isBest && starsRun>0) ? 'block' : 'none';
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('endOverlay').style.display='flex';
  refreshMenu();
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('stopBtn').addEventListener('click', ()=>endRun('Nice swim!'));

// Always-to-launcher: bank in-progress stars first so a mid-run tap doesn't lose them
function goToLauncher(){
  if(state === 'play' && starsRun > 0){
    save.stars += starsRun;
    if(starsRun > (save.best||0)) save.best = starsRun;
    saveData();
  }
  window.location.href = 'index.html';
}
document.getElementById('homeBtn').addEventListener('click', goToLauncher);   // end-overlay Home
document.getElementById('homeFab').addEventListener('click', goToLauncher);   // persistent corner button

// Parent-gated reset — wipes Zeezix Swim progress only
function resetThisGame(){
  const a = 3 + Math.floor(Math.random()*7);
  const b = 3 + Math.floor(Math.random()*7);
  const answer = prompt('Parent gate — what is ' + a + ' × ' + b + '?');
  if(answer === null) return;
  if(parseInt(answer,10) !== a*b){ alert('That’s not quite right — nothing was changed.'); return; }
  if(!confirm('Reset Zeezix Swim progress (stars and best)?')) return;
  try { localStorage.removeItem(SAVE_FALLBACK_KEY); } catch(e){}
  save = {stars:0, best:0, runs:0};
  saveData();
  refreshMenu();
  alert('Zeezix Swim reset. Tap Play to start fresh!');
}
const resetLink = document.getElementById('resetThisGame');
if(resetLink) resetLink.addEventListener('click', resetThisGame);

/* ---------- Input: hold = swim up, release = drift down ---------- */
canvas.addEventListener('pointerdown', e=>{ if(state==='play') hold = true; });
window.addEventListener('pointerup', ()=>{ hold = false; });
window.addEventListener('pointercancel', ()=>{ hold = false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
const UP_KEYS = [' ','ArrowUp','w','W','Enter'];
window.addEventListener('keydown', e=>{ if(UP_KEYS.includes(e.key)){ if(state==='play') hold = true; e.preventDefault(); } });
window.addEventListener('keyup', e=>{ if(UP_KEYS.includes(e.key)) hold = false; });

/* Pause on blur / YouTube onPause */
YTGame.onPause(()=>{ paused=true; hold=false; });
YTGame.onResume(()=>{ paused=false; });
// YouTube audio settings respect
muted = !YTGame.initialAudioEnabled();
muteBtn.textContent = muted ? '🔇' : '🔊';
YTGame.onAudioChange((enabled)=>{
  muted = !enabled;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

/* ---------- Spawning ---------- */
const CORAL_COLORS = [['#FF82B4','#E0457B'],['#FFB04C','#E8862A'],['#A6E86A','#5BBF3F'],['#FF9EC6','#FF6F91']];
function spawnPillar(x){
  const gh = gapH(), sh = sandHeight();
  const minY = topLimit() + gh/2 + 10, maxY = H - sh - gh/2 - 10;
  const gy = maxY > minY ? rnd(minY, maxY) : (minY+maxY)/2;
  const col = CORAL_COLORS[(spawned++) % CORAL_COLORS.length];
  pillars.push({x, w:pillarW(), gy, gh, c:col, bumps:[rnd(0.2,0.8),rnd(0.2,0.8),rnd(0.2,0.8)]});
  // a star in the gap, plus bubbles on the way to the next pillar
  items.push({k:'star', x:x + pillarW()/2, y:gy, r:16, t:rnd(0,6), taken:false});
  const n = 2 + Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    items.push({k:'bub', x:x + pillarW() + rnd(60, pillarGap()-80), y:rnd(topLimit()+40, H-sh-40), r:14, t:rnd(0,6), taken:false});
  }
  if(Math.random()<0.5){
    const sx = x + pillarW() + pillarGap()*0.5, sy = rnd(topLimit()+60, H-sh-60);
    for(let i=-1;i<=1;i++) items.push({k:'star', x:sx + i*40, y:sy - (i===0?22:0), r:14, t:rnd(0,6), taken:false});
  }
}
function circRect(cx,cy,r,x,y,w,h){
  const nx=Math.max(x,Math.min(cx,x+w)), ny=Math.max(y,Math.min(cy,y+h));
  return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny) < r*r;
}

/* ---------- Draw helpers ---------- */
function ell(x,y,rx,ry,rot,fill,stroke,lw){
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||2.5; ctx.stroke(); }
}
function star(x,y,r,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2 + i*Math.PI/5; const rr = i%2===0? r : r*0.45; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke(); }
}
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function eye(x,y,r,iris){
  ell(x,y,r,r,0,'#fff',INK,2);
  ell(x+r*0.15,y+r*0.1,r*0.55,r*0.55,0,iris||'#7C3AED');
  ell(x+r*0.15,y+r*0.1,r*0.3,r*0.3,0,INK);
  ell(x+r*0.35,y-r*0.25,r*0.2,r*0.2,0,'#fff');
}
function drawWater(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#B6ECFF'); g.addColorStop(0.45,'#5FBCF0'); g.addColorStop(1,'#2F8FD6');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=0.12; ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){
    const x=(i+0.5)*W/5 + Math.sin(t*0.4+i)*24;
    ctx.beginPath(); ctx.moveTo(x-16,0); ctx.lineTo(x+16,0); ctx.lineTo(x+80,H*0.75); ctx.lineTo(x-70,H*0.75); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // distant reef hills (slow parallax)
  const sh = sandHeight();
  bg.hills.forEach(h=>{
    const span = 2200;
    const x = ((h.x - scroll*0.25) % span + span) % span - 200;
    ctx.fillStyle=h.c; ctx.beginPath(); ctx.ellipse(x, H-sh+10, h.r, h.r*0.55, 0, Math.PI, 0); ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,0.35)';
  bg.bubbles.forEach(b=>{
    b.y -= b.v*lastDt; b.x -= speed*0.15*lastDt;
    if(b.y < -10){ b.y = H+10; b.x = rnd(0,W); } if(b.x < -10) b.x = W+10;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  });
}
function drawSand(){
  const sh = sandHeight();
  ctx.fillStyle='#F6E3A1';
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H-sh);
  const off = ((scroll*0.6) % 40 + 40) % 40;
  for(let x=-off;x<=W+40;x+=40){ ctx.quadraticCurveTo(x+20, H-sh-8, x+40, H-sh); }
  ctx.lineTo(W+40,H); ctx.closePath(); ctx.fill();
  // seaweed tufts scroll with the sand
  ctx.lineCap='round'; ctx.lineWidth=6;
  for(let i=0;i<Math.ceil(W/140)+2;i++){
    const span = 140, x = ((i*span + 50 - scroll*0.6) % (W+span) + (W+span)) % (W+span) - span/2;
    ctx.strokeStyle=['#7ED957','#4CC94C','#A6E86A'][i%3];
    const sway = Math.sin(t*1.3+i)*7;
    ctx.beginPath(); ctx.moveTo(x, H-sh+6); ctx.quadraticCurveTo(x+sway*1.5, H-sh-22, x+sway, H-sh-40); ctx.stroke();
  }
}
function drawPillar(p){
  const sh = sandHeight();
  const topH = p.gy - p.gh/2, botY = p.gy + p.gh/2;
  const [c1,c2] = p.c;
  // bottom coral (grows from sand)
  ctx.fillStyle=c1; rr(p.x, botY, p.w, H-botY+30, 16); ctx.fill();
  ctx.fillStyle=c2; p.bumps.forEach((b,i)=>{ ctx.beginPath(); ctx.arc(p.x + (i%2?p.w:0), botY + 30 + b*(H-sh-botY-40), 10+i*2, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle='rgba(255,255,255,0.28)'; rr(p.x+6, botY+8, 7, Math.max(10, H-sh-botY-20), 4); ctx.fill();
  ctx.fillStyle=c2; ctx.beginPath(); ctx.ellipse(p.x+p.w/2, botY+4, p.w*0.62, 14, 0, 0, Math.PI*2); ctx.fill();
  // top coral (hangs from the surface)
  ctx.fillStyle=c1; rr(p.x, -30, p.w, topH+30, 16); ctx.fill();
  ctx.fillStyle=c2; p.bumps.forEach((b,i)=>{ ctx.beginPath(); ctx.arc(p.x + (i%2?0:p.w), b*(topH-30), 10+i*2, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle='rgba(255,255,255,0.28)'; rr(p.x+6, 8, 7, Math.max(10, topH-24), 4); ctx.fill();
  ctx.fillStyle=c2; ctx.beginPath(); ctx.ellipse(p.x+p.w/2, topH-4, p.w*0.62, 14, 0, 0, Math.PI*2); ctx.fill();
}
function drawItem(it){
  if(it.k==='star'){
    const bob = Math.sin(it.t*3)*4;
    ctx.save(); ctx.translate(it.x, it.y+bob); ctx.rotate(Math.sin(it.t*2)*0.25);
    ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#FFDC50'; ctx.beginPath(); ctx.arc(0,0,it.r*1.5,0,Math.PI*2); ctx.fill(); ctx.restore();
    star(0,0,it.r,'#FFDC50',INK);
    ctx.restore();
  } else {
    const bob = Math.sin(it.t*2.5)*3;
    ctx.save(); ctx.translate(it.x, it.y+bob);
    const g = ctx.createRadialGradient(-it.r*0.3,-it.r*0.3,it.r*0.1,0,0,it.r);
    g.addColorStop(0,'rgba(255,255,255,0.8)'); g.addColorStop(1,'rgba(210,240,255,0.55)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(-it.r*0.4,-it.r*0.45,it.r*0.18,it.r*0.1,-0.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawZeezixSide(x,y,s,ang,sq){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s*(1+sq*0.18), s*(1-sq*0.18));
  const wag = Math.sin(t*(hold?14:8))*0.3;
  ctx.save(); ctx.translate(-30,0); ctx.rotate(wag);
  ctx.fillStyle='#5B2D9B'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-20,-15); ctx.lineTo(-15,0); ctx.lineTo(-20,15); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ell(-4,-24,12,6,0,'#9C64F2',INK);
  ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(12,-22); ctx.quadraticCurveTo(14,-44,30,-46); ctx.stroke();
  ctx.save(); ctx.globalAlpha=0.35+0.15*Math.sin(t*5); ctx.fillStyle='#FFDC50'; ctx.beginPath(); ctx.arc(33,-49,15,0,Math.PI*2); ctx.fill(); ctx.restore();
  star(33,-49,9,'#FFDC50',INK);
  const g=ctx.createLinearGradient(0,-26,0,26); g.addColorStop(0,'#A87FF5'); g.addColorStop(1,'#5B2D9B');
  ell(0,0,34,26,0,g,INK,3);
  ell(4,10,22,11,0,'#FF9EC6');
  ell(-6,8,10,6,0.5,'#9C64F2',INK);
  eye(16,-6,9);
  ell(27,7,4,3,0,'#FF82B4');
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(28,2,4,0.2,Math.PI-0.2); ctx.stroke();
  ctx.restore();
}
function drawHome(h){
  ctx.save(); ctx.translate(h.x, h.y);
  const s = h.s;
  ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(0,62,70,10,0,0,Math.PI*2); ctx.fill();
  const g=ctx.createLinearGradient(0,-70,0,60); g.addColorStop(0,'#A87FF5'); g.addColorStop(1,'#5B2D9B');
  ctx.fillStyle=g; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-66,60); ctx.quadraticCurveTo(-70,-40,0,-70); ctx.quadraticCurveTo(70,-40,66,60); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#C8B6E2'; ctx.lineWidth=3;
  for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(0,-62); ctx.quadraticCurveTo(i*22, 0, i*30, 58); ctx.stroke(); }
  ctx.fillStyle='#FFE9B0'; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-22,60); ctx.lineTo(-22,10); ctx.quadraticCurveTo(0,-16,22,10); ctx.lineTo(22,60); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.globalAlpha=0.5+0.2*Math.sin(t*4); ctx.fillStyle='#FFDC50'; ctx.beginPath(); ctx.arc(0,-34,20,0,Math.PI*2); ctx.fill(); ctx.restore();
  star(0,-34,12,'#FFDC50',INK);
  ctx.restore();
}
function drawProgress(){
  if(state==='menu') return;
  const w = Math.min(W*0.42, 240), x = W/2 - w/2, y = SAFE_TOP + 30;
  const p = Math.min(1, elapsed/DUR);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.25)'; rr(x, y-6, w, 12, 6); ctx.fill();
  ctx.fillStyle='#FFDC50'; rr(x, y-6, Math.max(12, w*p), 12, 6); ctx.fill();
  star(x + w*p, y, 11, '#FFDC50', INK);
  // little home marker at the end
  ctx.fillStyle='#A87FF5'; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+w-12,y+10); ctx.lineTo(x+w-12,y-2); ctx.quadraticCurveTo(x+w,y-16,x+w+12,y-2); ctx.lineTo(x+w+12,y+10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawParts(){
  parts.forEach(p=>{
    ctx.globalAlpha = Math.max(0,p.life);
    if(p.star) star(p.x,p.y,p.r,p.c);
    else { ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  });
  ctx.globalAlpha=1;
}
function burst(x,y,n,colors,stars){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rnd(50,180);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,r:rnd(3,6),life:1,c:colors[i%colors.length],star:stars && i%2===0});
  }
}

/* ---------- Update ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.04, (now-last)/1000);
  last = now; lastDt = dt; t += dt;
  if(state==='play' && !paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
function update(dt){
  elapsed += dt;
  speed = 150 + 60*Math.min(1, elapsed/DUR);
  scroll += speed*dt;
  const R = zzR(), sh = sandHeight();

  // swim physics: hold = gentle upward push, release = slow drift down
  if(hold) zz.vy -= 900*dt; else zz.vy += 520*dt;
  zz.vy = Math.max(-300, Math.min(220, zz.vy));
  zz.y += zz.vy*dt;
  if(zz.y < topLimit()+R){ zz.y = topLimit()+R; zz.vy = Math.max(0, zz.vy*-0.3); }
  if(zz.y > H-sh-R){ zz.y = H-sh-R; zz.vy = Math.min(0, zz.vy*-0.3); }
  zz.tilt += ((Math.max(-0.45, Math.min(0.45, zz.vy/600))) - zz.tilt) * Math.min(1, dt*6);
  if(zz.squash>0) zz.squash -= dt*3;
  if(zz.bump>0) zz.bump -= dt;

  // world scroll
  pillars.forEach(p=> p.x -= speed*dt);
  items.forEach(it=>{ it.x -= speed*dt; it.t += dt; });
  pillars = pillars.filter(p=> p.x + p.w > -40);
  items = items.filter(it=> it.x > -60 && !it.taken);
  nextPillarX -= speed*dt;

  // spawn coral gaps until it's time to swim home
  if(elapsed < DUR - 6 && nextPillarX < W + 40){
    spawnPillar(nextPillarX);
    nextPillarX += pillarGap();
  }
  // swim home finish
  if(elapsed >= DUR && !home){
    home = {x: W + 160, y: H - sh - 60*0.9, s: 0.9};
  }
  if(home){
    home.x -= speed*dt;
    if(home.x < zz.x + 30) endRun('Home sweet home!');
  }

  // soft bumps on coral — no penalty, just a boing
  pillars.forEach(p=>{
    const topH = p.gy - p.gh/2, botY = p.gy + p.gh/2;
    const hitTop = circRect(zz.x, zz.y, R*0.9, p.x, -40, p.w, topH+40);
    const hitBot = circRect(zz.x, zz.y, R*0.9, p.x, botY, p.w, H-botY+40);
    if((hitTop || hitBot) && zz.bump<=0){
      zz.bump = 0.5; zz.squash = 1; boingSound();
      if(hitTop){ zz.vy = 240; } else { zz.vy = -260; }
      // nudge the coral away a touch so the bounce reads as a bounce
      p.x += 18;
      burst(zz.x + R*0.6, zz.y, 6, ['#fff','#C8B6E2'], false);
    }
  });

  // collect stars and bubbles
  items.forEach(it=>{
    if(it.taken) return;
    if(Math.hypot(it.x - zz.x, it.y - zz.y) < R + it.r){
      it.taken = true;
      if(it.k==='star'){ starsRun++; starSound(); burst(it.x,it.y,12,['#FFDC50','#fff','#FF82B4'],true); document.getElementById('stars').textContent = starsRun; }
      else { bubsRun++; bubbleSound(); burst(it.x,it.y,8,['#fff','#B6ECFF'],false); document.getElementById('bubs').textContent = bubsRun; }
    }
  });

  parts.forEach(p=>{ p.x+=p.vx*dt - speed*dt*0.5; p.y+=p.vy*dt; p.vy+=140*dt; p.life-=dt*1.6; });
  parts = parts.filter(p=>p.life>0);
}
function draw(){
  drawWater();
  pillars.forEach(drawPillar);
  if(home) drawHome(home);
  drawSand();
  items.forEach(drawItem);
  const s = zzR()/30;
  if(state==='menu'){
    drawZeezixSide(W*0.28, H*0.45 + Math.sin(t*2)*6, s, Math.sin(t*1.5)*0.08, 0);
  } else {
    drawZeezixSide(zz.x, zz.y, s, zz.tilt, Math.max(0, zz.squash));
  }
  drawParts();
  drawProgress();
}
requestAnimationFrame(frame);

/* iOS audio unlock on first touch */
document.addEventListener('pointerdown', ()=>{ ensureAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, {once:true});

/* Boot: load save data, signal Playables, mark ready to play */
(async function boot(){
  await bootSave();
  // First frame about to draw — notify YouTube
  requestAnimationFrame(()=>{
    YTGame.firstFrameReady();
    // We're interactable as soon as the menu overlay is up (which it already is)
    YTGame.gameReady();
  });
})();
</script>
</body>
