<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Magic Coloring Book</title>
<!-- YouTube Playables SDK (loaded before game code per cert requirement). Graceful no-op if not present. -->
<script src="https://www.youtube.com/game_api/v1" onerror="window.__ytGameLoadFailed=true"></script>
<style>
  :root{--bg:#fff8e7;--ink:#2d2a26;--accent:#ff6f91;}
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden;
    font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    color:var(--ink);touch-action:manipulation;height:100%;min-height:100svh;width:100%;}
  body{height:100svh;}
  #root{position:fixed;inset:0;display:flex;flex-direction:column;height:100svh;}
  header{padding-top:calc(10px + env(safe-area-inset-top,0));}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    background:var(--bg);box-shadow:0 2px 0 rgba(0,0,0,.06);z-index:5;}
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px;}
  .icobtn{background:#fff;border:none;width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.1);}
  .icobtn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.1);}
  .topright{display:flex;gap:8px;}
  main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  #stage{max-width:100%;max-height:100%;width:100%;height:100%;display:block;}
  #stage svg{width:100%;height:100%;display:block;}
  #stage svg .region{cursor:pointer;transition:fill .15s ease;}
  footer{padding:10px 8px calc(10px + env(safe-area-inset-bottom,0));background:var(--bg);box-shadow:0 -2px 0 rgba(0,0,0,.06);}
  .palette{display:flex;gap:8px;overflow-x:auto;padding:4px 8px;scrollbar-width:none;}
  .palette::-webkit-scrollbar{display:none;}
  .swatch{flex:0 0 auto;width:54px;height:54px;border-radius:14px;border:3px solid transparent;cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.1);position:relative;}
  .swatch.selected{border-color:var(--ink);transform:scale(1.06);}
  .swatch[data-locked="true"]::after{
    content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);border-radius:11px;color:#fff;font-size:18px;}
  /* Overlays center short content but scroll when there are many scene cards (9 scenes on a phone). */
  .overlay{position:fixed;inset:0;background:rgba(255,248,231,.95);display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;z-index:20;text-align:center;padding:20px;
    box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .overlay::before,.overlay::after{content:"";display:block;margin:auto;flex:0 0 0px;}
  .overlay > *{flex-shrink:0;}
  .overlay h2{font-size:30px;margin:0 0 14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:680px;width:100%;margin:0 auto;}
  .scene-card{background:#fff;border-radius:18px;padding:10px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.1);
    position:relative;border:none;}
  .scene-card svg{width:100%;height:96px;display:block;}
  .scene-card .title{font-size:13px;font-weight:700;margin-top:6px;text-align:center;}
  .scene-card.done::after{content:"✓";position:absolute;top:8px;right:10px;background:var(--accent);color:#fff;border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;}
  .big{font-size:22px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 26px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  .big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:25;}
</style>
</head>
<body>
<div id="root">
  <header>
    <button class="icobtn" id="homeBtn" title="All games (Zeezix)">⭐</button>
    <h1 id="sceneTitle">Magic Coloring Book</h1>
    <div class="topright">
      <button class="icobtn" id="undoBtn" title="Undo last color">↶</button>
      <button class="icobtn" id="clearSceneBtn" title="Clear page (start this picture over)">✨</button>
      <button class="icobtn" id="saveBtn" title="Save picture">💾</button>
      <button class="icobtn" id="muteBtn" title="Mute">🔊</button>
    </div>
  </header>
  <main><div id="stage"></div></main>
  <footer>
    <div class="palette" id="palette"></div>
  </footer>
</div>

<div id="homeOverlay" class="overlay">
  <h2>📖 Magic Coloring Book</h2>
  <p style="opacity:.8;margin:-8px 0 18px">Pick a scene to color</p>
  <div class="grid" id="sceneGrid"></div>
  <p style="margin-top:18px;font-size:13px;opacity:.7">Scenes done: <span id="doneCount">0</span> / <span id="totalCount">9</span></p>
  <button id="resetThisGame" style="margin-top:4px;background:transparent;border:none;color:rgba(45,42,38,.55);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 10px;">⚙ Parents: reset this game</button>
</div>

<div id="winOverlay" class="overlay" style="display:none">
  <h2>🎉 Ta-da!</h2>
  <div id="winPreview" style="width:min(80vw,360px);height:240px;background:#fff;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.1);padding:12px;margin-bottom:18px;"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="big" id="nextSceneBtn">▶ Next scene</button>
    <button class="icobtn" id="saveWinBtn" style="width:auto;padding:0 16px">💾 Save image</button>
    <button class="icobtn" id="winHomeBtn" style="width:auto;padding:0 16px">🏠 Home</button>
  </div>
</div>

<canvas id="confetti" class="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================

/* ----------- YouTube Playables SDK Bridge (no-op fallback) ----------- */
const SAVE_FALLBACK_KEY = 'coloring_book_v1';
const YTGame = (() => {
  const hasSdk = typeof ytgame !== 'undefined';
  const inPlayables = hasSdk && !!ytgame.IN_PLAYABLES_ENV;
  const safe = (fn) => { try { return fn(); } catch(e){ return undefined; } };
  return {
    hasSdk, inPlayables,
    firstFrameReady(){ if(hasSdk) safe(()=>ytgame.game.firstFrameReady()); },
    gameReady(){ if(hasSdk) safe(()=>ytgame.game.gameReady()); },
    saveData(obj){
      const s = JSON.stringify(obj);
      if(inPlayables) safe(()=>ytgame.game.saveData(s));
      try{ localStorage.setItem(SAVE_FALLBACK_KEY, s); }catch(e){}
    },
    async loadData(fallback){
      if(inPlayables){ try{ const s = await ytgame.game.loadData(); if(s) return JSON.parse(s); }catch(e){} }
      try{ const s = localStorage.getItem(SAVE_FALLBACK_KEY); if(s) return JSON.parse(s); }catch(e){}
      return fallback;
    },
    sendScore(value){
      if(inPlayables && typeof value === 'number' && isFinite(value))
        safe(()=>ytgame.engagement.sendScore({value: Math.floor(value)}));
    },
    onPause(cb){
      if(hasSdk) safe(()=>ytgame.system.onPause(cb));
      window.addEventListener('blur', cb);
      document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cb(); });
    },
    onResume(cb){
      if(hasSdk) safe(()=>ytgame.system.onResume(cb));
      window.addEventListener('focus', cb);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cb(); });
    },
    initialAudioEnabled(){
      if(hasSdk){ const v = safe(()=>ytgame.system.isAudioEnabled()); if(typeof v === 'boolean') return v; }
      return true;
    },
    onAudioChange(cb){ if(hasSdk) safe(()=>ytgame.system.onAudioEnabledChange(cb)); },
    logError(msg){ if(hasSdk) safe(()=>ytgame.health.logError()); if(msg) console.warn('[coloring]', msg); },
  };
})();
window.addEventListener('error', e => YTGame.logError(e && e.message));

/* ---------- State (Playables saveData + localStorage fallback) ---------- */
let save = {fills:{}, done:[], palette:'base'};
function persist(){ YTGame.saveData(save); }
async function bootSave(){
  save = await YTGame.loadData({fills:{}, done:[], palette:'base'});
  if(!save.fills) save.fills = {};
  if(!save.done) save.done = [];
  if(!save.palette) save.palette = 'base';
}

let currentScene = null; // scene object
let currentColor = '#e63946';
let history = []; // [{el, id, prev, prevPainted}]
let winArmed = true; // the "Ta-da!" fires once per completion, not on every later tap

/* ---------- Audio ---------- */
let audioCtx=null, muted=false;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function blip(freq,dur,type='sine',vol=0.18){
  if(!audioCtx||muted) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur);
}
function fillSound(){ blip(560,0.12,'sine',0.18); blip(720,0.10,'sine',0.10); }
function swatchSound(){ blip(880,0.08,'triangle',0.16); }
function undoSound(){ blip(360,0.16,'sawtooth',0.12); }
function winFanfare(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'triangle',0.2),i*120)); }
document.addEventListener('pointerdown', ()=>{ ensureAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, {once:true});

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', ()=>{ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; });

/* Respect YouTube audio settings */
muted = !YTGame.initialAudioEnabled();
muteBtn.textContent = muted ? '🔇' : '🔊';
YTGame.onAudioChange((enabled)=>{ muted = !enabled; muteBtn.textContent = muted ? '🔇' : '🔊'; });

/* Pause / Resume — coloring is mostly idle; we just persist on pause */
YTGame.onPause(()=>{ try{ persist(); }catch(e){} });
YTGame.onResume(()=>{});

/* ---------- Toast ---------- */
const toast = document.getElementById('toast');
function showToast(msg, ms=1400){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>toast.classList.remove('show'), ms);
}

/* ---------- Build palette UI ---------- */
function paletteColors(){
  if(save.palette==='cosmic' && save.done.length>=3) return COSMIC;
  if(save.palette==='sparkle' && save.done.length>=6) return SPARKLE;
  return BASE;
}
function renderPalette(){
  const pal = document.getElementById('palette'); pal.innerHTML='';
  paletteColors().forEach((c,i)=>{
    const s = document.createElement('button');
    s.className='swatch' + (c===currentColor?' selected':'');
    s.style.background = c;
    s.setAttribute('aria-label','Color '+(i+1));
    s.addEventListener('click', ()=>{ currentColor=c; swatchSound(); renderPalette(); });
    pal.appendChild(s);
  });
  // unlockable indicators
  if(save.done.length>=3 && save.palette!=='cosmic'){
    const btn = document.createElement('button');
    btn.className='swatch'; btn.style.background='linear-gradient(135deg,#0d1b2a,#9c64f2)';
    btn.title='Unlock Cosmic palette';
    btn.addEventListener('click', ()=>{ save.palette='cosmic'; persist(); renderPalette(); showToast('🌌 Cosmic palette!'); });
    pal.appendChild(btn);
  }
  if(save.done.length>=6 && save.palette!=='sparkle'){
    const btn = document.createElement('button');
    btn.className='swatch'; btn.style.background='linear-gradient(135deg,#ffd54a,#ff7eb4,#3aa6ff)';
    btn.title='Unlock Sparkle palette';
    btn.addEventListener('click', ()=>{ save.palette='sparkle'; persist(); renderPalette(); showToast('✨ Sparkle palette!'); });
    pal.appendChild(btn);
  }
}

/* ---------- Render scene ---------- */
function renderScene(sceneId){
  const sc = SCENES.find(s=>s.id===sceneId); if(!sc) return;
  currentScene = sc;
  document.getElementById('sceneTitle').textContent = sc.title;
  document.getElementById('homeOverlay').style.display='none';
  document.getElementById('winOverlay').style.display='none';
  const stage = document.getElementById('stage');
  stage.innerHTML = sc.svg;
  const sceneFills = (save.fills[sc.id] = save.fills[sc.id] || {});
  history = [];
  const svg = stage.querySelector('svg');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.querySelectorAll('.region').forEach(node=>{
    const id = node.dataset.id;
    // data-painted marks a region the kid has tapped, so painting with the white swatch counts too
    if(sceneFills[id]){ node.setAttribute('fill', sceneFills[id]); node.dataset.painted = '1'; }
    node.addEventListener('click', ()=>{
      const prev = node.getAttribute('fill');
      const prevPainted = node.dataset.painted === '1';
      if(prevPainted && prev === currentColor) return;
      history.push({el:node, id, prev, prevPainted});
      node.setAttribute('fill', currentColor);
      node.dataset.painted = '1';
      sceneFills[id] = currentColor;
      persist();
      fillSound();
      checkComplete();
    });
  });
  winArmed = !isComplete();
  renderPalette();
}

function isComplete(){
  const stage = document.getElementById('stage');
  const all = stage.querySelectorAll('.region');
  if(!all.length) return false;
  for(const n of all){ if(n.dataset.painted !== '1') return false; }
  return true;
}
function checkComplete(){
  const sc = currentScene; if(!sc || !winArmed) return;
  // every region must have been painted (any color, white included)
  if(isComplete()){
    winArmed = false;
    setTimeout(()=>triggerWin(), 200);
  }
}

function triggerWin(){
  const sc = currentScene; if(!sc) return;
  if(!save.done.includes(sc.id)) save.done.push(sc.id);
  persist();
  YTGame.sendScore(save.done.length);
  winFanfare();
  fireConfetti();
  // preview
  const stage = document.getElementById('stage');
  const winPrev = document.getElementById('winPreview');
  winPrev.innerHTML = stage.innerHTML;
  // animate the scene briefly: simple celebrate wiggle
  const svg = stage.querySelector('svg');
  if(svg){
    svg.animate([{transform:'rotate(0deg)'},{transform:'rotate(-2deg)'},{transform:'rotate(2deg)'},{transform:'rotate(0deg)'}], {duration:600, iterations:2});
  }
  setTimeout(()=>{ document.getElementById('winOverlay').style.display='flex'; }, 700);
}

/* ---------- Confetti ---------- */
const cf = document.getElementById('confetti');
const cfctx = cf.getContext('2d');
function sizeConfetti(){ cf.width = window.innerWidth; cf.height = window.innerHeight; }
window.addEventListener('resize', sizeConfetti); sizeConfetti();
let confettiParts = [];
function fireConfetti(){
  confettiParts = [];
  for(let i=0;i<140;i++){
    confettiParts.push({
      x: window.innerWidth/2 + (Math.random()-0.5)*60,
      y: window.innerHeight/2,
      vx:(Math.random()-0.5)*600, vy:-Math.random()*700-200,
      r: 4+Math.random()*5, color:`hsl(${Math.random()*360},90%,60%)`, life:1.6
    });
  }
}
let cfLast = performance.now();
function cfLoop(now){
  const dt = Math.min(0.04,(now-cfLast)/1000); cfLast=now;
  cfctx.clearRect(0,0,cf.width,cf.height);
  confettiParts.forEach(p=>{
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 1200*dt; p.life -= dt*0.6;
    cfctx.globalAlpha = Math.max(0,p.life);
    cfctx.fillStyle = p.color;
    cfctx.fillRect(p.x, p.y, p.r, p.r);
  });
  cfctx.globalAlpha = 1;
  confettiParts = confettiParts.filter(p=>p.life>0);
  requestAnimationFrame(cfLoop);
}
requestAnimationFrame(cfLoop);

/* ---------- Buttons ---------- */
// All Home affordances go to the Zeezix launcher in one tap
function goToLauncher(){ window.location.href = 'index.html'; }
document.getElementById('homeBtn').addEventListener('click', goToLauncher);     // header 🎪
document.getElementById('winHomeBtn').addEventListener('click', goToLauncher);  // win-overlay 🏠 Home

// Parent-gated reset — wipes Magic Coloring Book progress only
function resetThisGame(){
  const a = 3 + Math.floor(Math.random()*7);
  const b = 3 + Math.floor(Math.random()*7);
  const answer = prompt('Parent gate — what is ' + a + ' × ' + b + '?');
  if(answer === null) return;
  if(parseInt(answer,10) !== a*b){ alert('That’s not quite right — nothing was changed.'); return; }
  if(!confirm('Reset Magic Coloring Book progress (all scenes and palette unlocks)?')) return;
  try { localStorage.removeItem('coloring_book_v1'); } catch(e){}
  save = {fills:{}, done:[], palette:'base'};
  persist();
  goHome();
  alert('Magic Coloring Book reset. Pick a scene to start fresh!');
}
const resetLink = document.getElementById('resetThisGame');
if(resetLink) resetLink.addEventListener('click', resetThisGame);

// "Clear page" button — wipes the current scene's fills (kid-discoverable, no gate)
function clearCurrentScene(){
  if(!currentScene) return;
  if(!confirm('Clear all colors on this picture?')) return;
  save.fills[currentScene.id] = {};
  persist();
  renderScene(currentScene.id);
}
const clearBtn = document.getElementById('clearSceneBtn');
if(clearBtn) clearBtn.addEventListener('click', clearCurrentScene);
document.getElementById('nextSceneBtn').addEventListener('click', ()=>{
  const idx = SCENES.findIndex(s=>s.id===currentScene.id);
  const next = SCENES[(idx+1)%SCENES.length];
  renderScene(next.id);
});
document.getElementById('undoBtn').addEventListener('click', ()=>{
  const last = history.pop(); if(!last) return;
  last.el.setAttribute('fill', last.prev || '#ffffff');
  if(last.prevPainted) last.el.dataset.painted = '1'; else delete last.el.dataset.painted;
  if(currentScene){
    const fills = (save.fills[currentScene.id] = save.fills[currentScene.id] || {});
    if(last.prevPainted && last.prev){ fills[last.id] = last.prev; }
    else delete fills[last.id];
    persist();
    if(!isComplete()) winArmed = true;
  }
  undoSound();
});
function downloadCurrent(){
  const stage = document.getElementById('stage');
  const svgEl = stage.querySelector('svg'); if(!svgEl) return;
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svgEl);
  const blob = new Blob([svgStr], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 900;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff8e7'; cx.fillRect(0,0,c.width,c.height);
    cx.drawImage(img, 0,0, c.width, c.height);
    c.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = (currentScene?currentScene.id:'coloring') + '.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
document.getElementById('saveBtn').addEventListener('click', downloadCurrent);
document.getElementById('saveWinBtn').addEventListener('click', downloadCurrent);

window.addEventListener('keydown', e=>{
  if(e.key>='1' && e.key<='9'){
    const i = parseInt(e.key,10)-1;
    const pal = paletteColors();
    if(i<pal.length){ currentColor=pal[i]; swatchSound(); renderPalette(); }
  } else if(e.key==='z' || e.key==='Z'){
    document.getElementById('undoBtn').click();
  } else if(e.key==='Escape'){
    goHome();
  }
});

/* ---------- Home ---------- */
function thumbForScene(s){
  // small preview svg
  const fills = save.fills[s.id] || {};
  const stage = document.createElement('div'); stage.innerHTML = s.svg;
  const svg = stage.querySelector('svg');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.querySelectorAll('.region').forEach(n=>{
    const id = n.dataset.id;
    if(fills[id]) n.setAttribute('fill', fills[id]);
  });
  return stage.innerHTML;
}
function renderHome(){
  document.getElementById('homeOverlay').style.display='flex';
  document.getElementById('winOverlay').style.display='none';
  const grid = document.getElementById('sceneGrid'); grid.innerHTML='';
  SCENES.forEach(s=>{
    const card = document.createElement('button');
    card.className = 'scene-card' + (save.done.includes(s.id)?' done':'');
    card.innerHTML = thumbForScene(s) + `<div class="title">${s.title}</div>`;
    card.addEventListener('click', ()=>{
      ensureAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      renderScene(s.id);
    });
    grid.appendChild(card);
  });
  document.getElementById('doneCount').textContent = save.done.length;
  document.getElementById('totalCount').textContent = SCENES.length;
  document.getElementById('sceneTitle').textContent = 'Magic Coloring Book';
}
function goHome(){ currentScene=null; renderHome(); }

/* Boot */
(async function boot(){
  await bootSave();
  goHome();
  requestAnimationFrame(()=>{
    YTGame.firstFrameReady();
    YTGame.gameReady();
    // Send score = scenes completed (a simple progress score)
    YTGame.sendScore(save.done.length);
  });
})();
</script>
