<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Rainbow Runner</title>
<!-- YouTube Playables SDK (loads only inside the Playables environment; otherwise script 404s and bridge no-ops). -->
<script src="https://www.youtube.com/game_api/v1" onerror="window.__ytGameLoadFailed=true"></script>
<style>
  html,body{margin:0;padding:0;background:#7ec8e3;overflow:hidden;
    font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;height:100%;min-height:100svh;width:100%;}
  body{height:100svh;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#7ec8e3;}
  /* Home button visible during gameplay */
  #homeFab{position:fixed;top:calc(10px + env(safe-area-inset-top,0));left:10px;width:46px;height:46px;
    border-radius:999px;background:rgba(255,255,255,.92);color:#222;border:none;font-size:20px;
    cursor:pointer;z-index:10;box-shadow:0 2px 0 rgba(0,0,0,.15);}
  #homeFab:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.15);}
  .hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;
       pointer-events:none;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);
       font-size:22px;z-index:5;}
  .hud .pill{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px;}
  .btn{pointer-events:auto;background:#fff;color:#333;border:none;border-radius:999px;
       padding:10px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15);
       cursor:pointer;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
  #muteBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0));right:10px;width:46px;height:46px;border-radius:999px;
           background:rgba(255,255,255,.9);border:none;font-size:20px;cursor:pointer;z-index:10;}
  .hud{top:calc(70px + env(safe-area-inset-top,0));}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
           justify-content:flex-start;flex-direction:column;color:#fff;text-align:center;z-index:20;
           padding:20px;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .overlay::before,.overlay::after{content:"";display:block;margin:auto;flex:0 0 0px;}
  .overlay > *{flex-shrink:0;}
  .overlay h1{font-size:44px;margin:0 0 8px;text-shadow:0 4px 0 rgba(0,0,0,.3);}
  .overlay p{font-size:20px;margin:6px 0 18px;opacity:.95;}
  .overlay .big{font-size:34px;background:#fff;color:#333;padding:18px 30px;border-radius:999px;
       border:none;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);}
  .overlay .big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;color:#fff;
        background:rgba(0,0,0,.35);padding:10px 16px;border-radius:999px;font-size:16px;z-index:5;}
  .critter-row{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap;justify-content:center;max-width:480px;}
  .critter-row button{background:#fff;color:#333;border:none;border-radius:18px;padding:8px;width:64px;height:64px;font-size:32px;cursor:pointer;position:relative;}
  .critter-row button svg{width:48px;height:48px;display:block;margin:0 auto;}
  .critter-row button.locked{opacity:.4;}
  .critter-row button.selected{outline:4px solid #FFDC50;}
  .critter-row .gemsNeeded{position:absolute;bottom:-6px;right:-6px;background:#333;color:#fff;font-size:11px;border-radius:999px;padding:2px 6px;}
  .theme-row{display:flex;gap:10px;margin:0 0 16px;justify-content:center;}
  .theme-row button{background:#fff;color:#333;border:none;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .theme-row button.selected{outline:4px solid #FFDC50;}
  #unlockMsg svg{width:40px;height:40px;vertical-align:middle;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="homeFab" aria-label="All games (Zeezix)">⭐</button>
<div class="hud">
  <div class="pill">💎 <span id="gems">0</span></div>
  <div class="pill">⏱ <span id="time">0</span>s</div>
</div>
<button id="muteBtn" aria-label="Mute">🔊</button>

<div id="startOverlay" class="overlay">
  <h1>🌈 Rainbow Runner</h1>
  <p>Tap to jump • Swipe to switch lane</p>
  <div class="critter-row" id="critterRow"></div>
  <div class="theme-row" id="themeRow">
    <button data-theme="land">🌈 Land</button>
    <button data-theme="reef">🐠 Reef</button>
  </div>
  <button class="big" id="startBtn">▶ Play</button>
  <p style="font-size:14px;opacity:.8;margin-top:14px;">Lifetime gems: <span id="lifetime">0</span></p>
  <button id="resetThisGame" style="margin-top:6px;background:transparent;border:none;color:rgba(255,255,255,.55);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 10px;">⚙ Parents: reset this game</button>
</div>

<div id="endOverlay" class="overlay" style="display:none">
  <h1 id="endTitle">You did great!</h1>
  <p>You collected <strong><span id="finalGems">0</span></strong> 💎</p>
  <p id="unlockMsg" style="display:none">🎉 New pal!</p>
  <button class="big" id="againBtn">▶ Play Again</button>
  <button class="btn" id="homeBtn" style="margin-top:14px">🏠 Home</button>
</div>

<script>
/* =================================================================
   Rainbow Runner — single-file HTML5 game for YouTube Playables.
   No external assets. No network calls.
   ================================================================= */

/* ----------------------------------------------------------------
   YouTube Playables SDK Bridge
   Safely wraps ytgame.* APIs. No-ops if SDK is absent or fails to
   load, so the game still plays on any host (Netlify, file://, etc.)
   ---------------------------------------------------------------- */
const SAVE_FALLBACK_KEY = 'rainbow_runner_v1';
const YTGame = (() => {
  const hasSdk = typeof ytgame !== 'undefined';
  const inPlayables = hasSdk && !!ytgame.IN_PLAYABLES_ENV;
  const safe = (fn) => { try { return fn(); } catch(e){ return undefined; } };
  return {
    hasSdk, inPlayables,
    firstFrameReady(){ if(hasSdk) safe(()=>ytgame.game.firstFrameReady()); },
    gameReady(){ if(hasSdk) safe(()=>ytgame.game.gameReady()); },
    saveData(obj){
      const s = JSON.stringify(obj);
      if(inPlayables){ safe(()=>ytgame.game.saveData(s)); }
      try{ localStorage.setItem(SAVE_FALLBACK_KEY, s); }catch(e){}
    },
    async loadData(fallback){
      if(inPlayables){
        try{ const s = await ytgame.game.loadData(); if(s) return JSON.parse(s); }catch(e){}
      }
      try{ const s = localStorage.getItem(SAVE_FALLBACK_KEY); if(s) return JSON.parse(s); }catch(e){}
      return fallback;
    },
    sendScore(value){
      if(inPlayables && typeof value === 'number' && isFinite(value)){
        safe(()=>ytgame.engagement.sendScore({value: Math.floor(value)}));
      }
    },
    onPause(cb){
      if(hasSdk) safe(()=>ytgame.system.onPause(cb));
      window.addEventListener('blur', cb);
      document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cb(); });
    },
    onResume(cb){
      if(hasSdk) safe(()=>ytgame.system.onResume(cb));
      window.addEventListener('focus', cb);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cb(); });
    },
    initialAudioEnabled(){
      if(hasSdk){ const v = safe(()=>ytgame.system.isAudioEnabled()); if(typeof v === 'boolean') return v; }
      return true;
    },
    onAudioChange(cb){
      if(hasSdk) safe(()=>ytgame.system.onAudioEnabledChange(cb));
    },
    logError(msg){ if(hasSdk) safe(()=>ytgame.health.logError()); if(msg) console.warn('[runner]', msg); },
  };
})();
window.addEventListener('error', e => YTGame.logError(e && e.message));

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  const vv = window.visualViewport;
  W = window.innerWidth;
  // Use visualViewport.height when available (iOS Safari) so we stay inside the actually-visible area.
  H = vv ? Math.round(vv.height) : window.innerHeight;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // Reposition the player so iOS toolbar shows/hides don't push him off-screen.
  // Wrapped in try/catch because resize() runs at script load before `let player`
  // is initialized (temporal dead zone — `typeof` on a `let` still throws).
  try {
    if (typeof player === 'object' && player) {
      if(!player.jumping) player.y = H * 0.78;
      if (typeof targetLane === 'number') player.x = (W/2) + (targetLane - 1) * (W*0.18);
    }
  } catch (e) { /* player not yet declared on first resize() — fine */ }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
resize();

/* ---------- Audio (WebAudio, generated on the fly) ---------- */
let audioCtx = null, muted = false, musicGain = null, musicNodes = [];
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function blip(freq, dur, type='sine', vol=0.18){
  if(!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur);
}
function gemSound(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.08,'triangle',0.16),i*40)); }
function jumpSound(){ blip(440,0.12,'square',0.14); blip(660,0.10,'square',0.10); }
// Soft, friendly "boop" on a bump (no harsh buzz)
function bumpSound(){ blip(330,0.14,'sine',0.16); setTimeout(()=>blip(262,0.18,'sine',0.14),90); }
function celebrateSound(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'triangle',0.18),i*100)); }
function swishSound(){ blip(600,0.18,'sine',0.10); setTimeout(()=>blip(900,0.16,'sine',0.08),90); }
function startMusic(){
  if(!audioCtx || muted) return;
  stopMusic();
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.06;
  musicGain.connect(audioCtx.destination);
  const notes = [262,330,392,330,294,330,392,440,392,330,262,330];
  const step = 0.32;
  function loop(start){
    notes.forEach((f,i)=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f;
      const t = start + i*step;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.6,t+0.02);
      g.gain.linearRampToValueAtTime(0,t+step*0.9);
      o.connect(g); g.connect(musicGain);
      o.start(t); o.stop(t+step);
      musicNodes.push(o);
    });
    const next = start + notes.length*step;
    musicNodes.push(setTimeout(()=>{ if(musicGain) loop(audioCtx.currentTime); }, (notes.length*step-0.1)*1000));
  }
  loop(audioCtx.currentTime+0.1);
}
function stopMusic(){
  musicNodes.forEach(n=>{ try{ if(typeof n==='number') clearTimeout(n); else n.stop(); }catch(e){} });
  musicNodes = [];
  if(musicGain){ try{ musicGain.disconnect(); }catch(e){} musicGain=null; }
}

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(muted) stopMusic(); else if(state==='play' && !paused) startMusic();
});

/* ---------- Critters & unlocks ---------- */
// Inline SVG icons for the two reef pals (no external images).
const ZEEZIX_ICON = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="12,38 2,30 5,38 2,46" fill="#5B2D9B"/>
  <polygon points="24,22 30,10 38,23" fill="#5B2D9B"/>
  <circle cx="30" cy="38" r="18" fill="#8B5CF6" stroke="#5B2D9B" stroke-width="2"/>
  <ellipse cx="30" cy="46" rx="11" ry="7" fill="#FF82B4"/>
  <circle cx="23" cy="34" r="5" fill="#fff"/><circle cx="37" cy="34" r="5" fill="#fff"/>
  <circle cx="24" cy="35" r="2.6" fill="#5B2D9B"/><circle cx="38" cy="35" r="2.6" fill="#5B2D9B"/>
  <path d="M26 41 q4 4 8 0" stroke="#5B2D9B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M34 21 q6 -12 16 -11" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="8" r="9" fill="#FFDC50" opacity=".35"/>
  <polygon points="52,2 53.5,5.9 57.7,6.2 54.5,8.8 55.5,12.9 52,10.6 48.5,12.9 49.5,8.8 46.3,6.2 50.5,5.9" fill="#FFDC50"/>
</svg>`;
const CORAL_ICON = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="12,36 2,26 5,36 2,46" fill="#f07b3f" stroke="#333" stroke-width="1.5"/>
  <polygon points="24,24 30,12 38,25" fill="#f07b3f" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="32" cy="36" rx="22" ry="14" fill="#f07b3f" stroke="#333" stroke-width="2"/>
  <path d="M40 24 q-4 12 0 24 h6 q-4 -12 0 -24 z" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <path d="M22 25 q-3 11 0 22 h5 q-3 -11 0 -22 z" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="49" cy="33" r="3.5" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="50" cy="33" r="1.6" fill="#222"/>
  <path d="M46 40 q4 2 7 -1" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>`;

const CRITTERS = [
  {id:'zeezix',  name:'Zeezix',  svg:ZEEZIX_ICON, need:0,   color:'#8B5CF6', kind:'zeezix'},
  {id:'fox',     name:'Fox',     emoji:'🦊', need:0,   color:'#f08c3a'},
  {id:'bunny',   name:'Bunny',   emoji:'🐰', need:50,  color:'#f4c2c2'},
  {id:'coral',   name:'Coral',   svg:CORAL_ICON,  need:100, color:'#f07b3f', kind:'coral'},
  {id:'owl',     name:'Owl',     emoji:'🦉', need:150, color:'#a47148'},
  {id:'dragon',  name:'Dragon',  emoji:'🐉', need:400, color:'#4caf50'},
  {id:'unicorn', name:'Unicorn', emoji:'🦄', need:800, color:'#c5a3ff'},
];
let chosenCritter = 'zeezix';

/* ---------- Persistence (Playables saveData + localStorage fallback) ---------- */
const DEFAULT_SAVE = () => ({lifetime:0, unlocked:['zeezix','fox'], critter:'zeezix', theme:'land'});
let save = DEFAULT_SAVE();
function saveData(){ YTGame.saveData(save); }
async function bootSave(){
  save = await YTGame.loadData(DEFAULT_SAVE());
  if(!save || typeof save !== 'object') save = DEFAULT_SAVE();
  if(typeof save.lifetime !== 'number' || !isFinite(save.lifetime)) save.lifetime = 0;
  if(!Array.isArray(save.unlocked)) save.unlocked = ['zeezix','fox'];
  if(CRITTERS.some(c=>c.id===save.critter)) chosenCritter = save.critter;
  if(save.theme==='reef' || save.theme==='land') menuTheme = save.theme;
  theme = menuTheme; prevTheme = menuTheme;
  syncUnlocks(); // derive unlocks from lifetime; nothing is written until real progress happens
  refreshCritterRow();
  refreshThemeRow();
}

// Adds any critter whose gem goal is reached. Returns the newly unlocked critter (if any). Never saves by itself.
function syncUnlocks(){
  let newly = null;
  if(!Array.isArray(save.unlocked)) save.unlocked = ['zeezix','fox'];
  CRITTERS.forEach(c=>{
    if(save.lifetime >= c.need && !save.unlocked.includes(c.id)){
      save.unlocked.push(c.id);
      if(c.need > 0) newly = c;
    }
  });
  return newly;
}

function refreshCritterRow(){
  const row = document.getElementById('critterRow'); row.innerHTML='';
  CRITTERS.forEach(c=>{
    const b = document.createElement('button');
    const unlocked = save.lifetime >= c.need;
    if(c.svg) b.innerHTML = c.svg; else b.textContent = c.emoji;
    b.setAttribute('aria-label', c.name);
    b.title = c.name;
    b.className = (unlocked? '' : 'locked ') + (c.id===chosenCritter? 'selected':'');
    if(!unlocked){
      const tag = document.createElement('div'); tag.className='gemsNeeded'; tag.textContent=c.need+'💎'; b.appendChild(tag);
    }
    b.addEventListener('click', ()=>{
      if(unlocked){ chosenCritter = c.id; save.critter = c.id; saveData(); refreshCritterRow(); }
    });
    row.appendChild(b);
  });
  document.getElementById('lifetime').textContent = save.lifetime;
}

/* ---------- Themes: 'land' (hills) and 'reef' (underwater). Visual only — collision is identical. ---------- */
const THEME_SWAP_SECONDS = 60;
let theme = 'land', prevTheme = 'land', menuTheme = 'land';
let themeFade = 0, themeT = 0, bannerT = 0, bannerText = '';
function refreshThemeRow(){
  document.querySelectorAll('#themeRow button').forEach(b=>{
    b.classList.toggle('selected', b.dataset.theme === menuTheme);
  });
}
document.querySelectorAll('#themeRow button').forEach(b=>{
  b.addEventListener('click', ()=>{
    menuTheme = b.dataset.theme === 'reef' ? 'reef' : 'land';
    save.theme = menuTheme; saveData();
    if(state !== 'play'){ theme = menuTheme; prevTheme = menuTheme; themeFade = 0; }
    refreshThemeRow();
  });
});
function switchTheme(){
  prevTheme = theme;
  theme = theme === 'land' ? 'reef' : 'land';
  themeFade = 1; bannerT = 2.2;
  bannerText = theme === 'reef' ? '🐠 Reef!' : '🌈 Land!';
  swishSound();
}

/* ---------- Game state ---------- */
let state = 'menu'; // 'menu' | 'play' | 'over'
let lanes = 3, lane = 1, targetLane = 1, laneSwitchT = 0;
let player = {x:0, y:0, vy:0, jumping:false, ducking:false, rot:0, tumble:0};
let obstacles = [], gems = [], particles = [];
let speed = 0, baseSpeed = 360, maxSpeed = 720;
let spawnT = 0, spawnInterval = 2.6;
let elapsed = 0, gemsThisRun = 0;
let bgScroll = 0;
let tNow = 0;               // seconds, for gentle animations
const RUN_LIMIT_SECONDS = 120; // soft cap: a run ends with a cheer at 2 minutes

const LANE_W_RATIO = 0.18;
function laneX(i){
  const cx = W/2; const lw = W*LANE_W_RATIO;
  return cx + (i-1)*lw;
}

function resetGame(){
  lane=1; targetLane=1; laneSwitchT=0;
  player = {x: laneX(1), y: H*0.78, vy:0, jumping:false, ducking:false, rot:0, tumble:0};
  obstacles=[]; gems=[]; particles=[];
  speed = baseSpeed; spawnT = 0; spawnInterval = 2.6; elapsed=0; gemsThisRun=0;
  bgScroll = 0;
  theme = menuTheme; prevTheme = menuTheme; themeFade = 0; themeT = 0; bannerT = 0;
  document.getElementById('gems').textContent = '0';
  document.getElementById('time').textContent = '0';
}

function startGame(){
  ensureAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  resetGame();
  state='play';
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('endOverlay').style.display='none';
  if(!muted) startMusic();
}

// reason: 'bump' (touched something) or 'done' (reached the 2-minute cheer)
function endGame(reason){
  if(state !== 'play') return; // guard: two obstacles in one frame must not end the run twice
  state='over';
  stopMusic();
  if(reason === 'done') celebrateSound(); else bumpSound();
  // friendly sparkle puff at the player (no injury animation)
  for(let i=0;i<18;i++){
    particles.push({x:player.x, y:player.y-10, vx:(Math.random()-.5)*300, vy:-Math.random()*260-40, r:4+Math.random()*4, color:`hsl(${Math.random()*360},90%,65%)`, life:1});
  }
  save.lifetime += gemsThisRun;
  const justUnlocked = syncUnlocks();
  saveData();
  YTGame.sendScore(save.lifetime);
  document.getElementById('finalGems').textContent = gemsThisRun;
  document.getElementById('endTitle').textContent = reason === 'done' ? 'Wow! Big run!' : 'You did great!';
  const um = document.getElementById('unlockMsg');
  um.style.display = justUnlocked ? 'block':'none';
  if(justUnlocked) um.innerHTML = '🎉 New pal! ' + (justUnlocked.svg ? justUnlocked.svg : justUnlocked.emoji);
  setTimeout(()=>{ if(state==='over') document.getElementById('endOverlay').style.display='flex'; }, 450);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

// Always-to-launcher: bank in-progress gems first so a mid-run tap doesn't lose them
function goToLauncher(){
  if(state === 'play' && gemsThisRun > 0){
    save.lifetime += gemsThisRun;
    gemsThisRun = 0;
    syncUnlocks();
    saveData();
  }
  stopMusic();
  window.location.href = 'index.html';
}
document.getElementById('homeBtn').addEventListener('click', goToLauncher);   // end-overlay Home
document.getElementById('homeFab').addEventListener('click', goToLauncher);   // persistent corner button

// Parent-gated reset — wipes Rainbow Runner progress only (lifetime gems, critter unlocks)
function resetThisGame(){
  const a = 3 + Math.floor(Math.random()*7);
  const b = 3 + Math.floor(Math.random()*7);
  const answer = prompt('Parent gate — what is ' + a + ' × ' + b + '?');
  if(answer === null) return;
  if(parseInt(answer,10) !== a*b){ alert('That’s not quite right — nothing was changed.'); return; }
  if(!confirm('Reset Rainbow Runner progress (gems and critter unlocks)?')) return;
  try { localStorage.removeItem('rainbow_runner_v1'); } catch(e){}
  save = DEFAULT_SAVE();
  chosenCritter = 'zeezix';
  menuTheme = 'land'; theme = 'land'; prevTheme = 'land';
  saveData();
  refreshCritterRow();
  refreshThemeRow();
  alert('Rainbow Runner reset. Tap Play to start fresh!');
}
const resetLink = document.getElementById('resetThisGame');

/* ---------- Input ---------- */
function moveLane(dir){
  if(state!=='play') return;
  const nl = Math.max(0, Math.min(lanes-1, targetLane + dir));
  if(nl!==targetLane){ targetLane=nl; laneSwitchT=0.18; }
}
function jump(){
  if(state!=='play' || player.jumping) return;
  player.jumping=true; player.vy=-720; jumpSound();
}
function duck(d){
  if(state!=='play') return;
  player.ducking = d;
}

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') moveLane(-1);
  else if(e.key==='ArrowRight'||e.key==='d') moveLane(1);
  else if(e.key===' '||e.key==='ArrowUp'||e.key==='w') jump();
  else if(e.key==='ArrowDown'||e.key==='s') duck(true);
});
window.addEventListener('keyup', e=>{ if(e.key==='ArrowDown'||e.key==='s') duck(false); });

let touchStartX=0, touchStartY=0, touchT=0, touchActive=false;
canvas.addEventListener('pointerdown', e=>{
  touchStartX = e.clientX; touchStartY = e.clientY; touchT = performance.now(); touchActive=true;
});
canvas.addEventListener('pointerup', e=>{
  if(!touchActive) return; touchActive=false;
  const dx = e.clientX - touchStartX, dy = e.clientY - touchStartY;
  const dt = performance.now() - touchT;
  if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)){
    moveLane(dx>0?1:-1);
  } else if(dy < -30){
    jump();
  } else if(dy > 30){
    // tap-down -> short duck
    duck(true); setTimeout(()=>duck(false), 500);
  } else if(dt < 250){
    jump();
  }
});
canvas.addEventListener('pointercancel', ()=>{ touchActive=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* Pause on blur / YouTube onPause / tab hidden */
let paused=false;
YTGame.onPause(()=>{ paused=true; stopMusic(); duck(false); });
YTGame.onResume(()=>{ paused=false; if(state==='play' && !muted) startMusic(); });
// YouTube audio settings respect
muted = !YTGame.initialAudioEnabled();
muteBtn.textContent = muted ? '🔇' : '🔊';
YTGame.onAudioChange((enabled)=>{
  muted = !enabled;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(muted) stopMusic(); else if(state==='play' && !paused) startMusic();
});

/* ---------- Spawning ---------- */
function spawnObstacle(){
  const type = Math.random() < 0.5 ? 'low' : 'high';
  const occupied = new Set();
  // Pick 1 or 2 lanes
  const count = elapsed>30 && Math.random()<0.25 ? 2 : 1;
  const choices = [0,1,2].sort(()=>Math.random()-0.5);
  for(let i=0;i<count;i++){
    obstacles.push({lane:choices[i], y:-80, type:type});
    occupied.add(choices[i]);
  }
  // Spawn a couple of gems in the free lanes
  for(let l=0;l<3;l++){
    if(occupied.has(l)) continue;
    if(Math.random()<0.55){
      gems.push({lane:l, y:-160, t:0, taken:false});
    }
  }
}

/* ---------- Draw helpers ---------- */
function drawStar(cx,cy,R,r,n){
  n = n || 5;
  ctx.beginPath();
  for(let k=0;k<n*2;k++){
    const a = -Math.PI/2 + k*Math.PI/n;
    const rad = (k%2===0) ? R : r;
    const px = cx + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
    if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function drawGround(th){
  // path with perspective stripes
  const horizon = H*0.42;
  const reef = th === 'reef';
  ctx.fillStyle = reef ? '#e9cf93' : '#4caf50'; ctx.fillRect(0,horizon,W,H-horizon);
  // path
  ctx.fillStyle = reef ? '#f7e4b3' : '#c79b6a';
  const pathTopW = W*0.32, pathBotW = W*1.5;
  ctx.beginPath();
  ctx.moveTo(W/2 - pathTopW/2, horizon);
  ctx.lineTo(W/2 + pathTopW/2, horizon);
  ctx.lineTo(W/2 + pathBotW/2, H);
  ctx.lineTo(W/2 - pathBotW/2, H);
  ctx.closePath(); ctx.fill();
  // lane stripes (moving) — sand ripples on the reef
  const stripes = 14;
  for(let i=0;i<stripes;i++){
    const t = ((i*60 + bgScroll) % 600) / 600; // 0..1
    const y = horizon + (H-horizon)*t*t;
    const w = pathTopW + (pathBotW-pathTopW)*t*t;
    ctx.fillStyle = reef ? `rgba(160,120,60,${0.10 + t*0.18})` : `rgba(255,255,255,${0.18 + t*0.3})`;
    ctx.fillRect(W/2 - w*0.005, y, w*0.01, 6+t*6);
    // side lane dividers
    ctx.fillRect(W/2 - w*0.16, y, w*0.012, 8+t*8);
    ctx.fillRect(W/2 + w*0.16 - w*0.012, y, w*0.012, 8+t*8);
  }
  drawSideScenery(th, horizon, pathTopW, pathBotW);
}
// Scenery along both sides of the path: coral + seaweed on the reef, bushes + flowers + trees on land.
function drawSideScenery(th, horizon, pathTopW, pathBotW){
  const N = 10, L = 1300;
  for(let i=0;i<N;i++){
    const t = ((i*130 + bgScroll) % L) / L;
    const y = horizon + (H-horizon)*t*t;
    if(y > H+40) continue;
    const w = pathTopW + (pathBotW-pathTopW)*t*t;
    const sc = 0.25 + t*1.1;
    const off = 26 + 30*sc;
    drawDeco(th, i%3, W/2 - w/2 - off, y, sc, i);
    drawDeco(th, (i+1)%3, W/2 + w/2 + off, y, sc, i+7);
  }
}
function drawDeco(th, kind, x, y, sc, seed){

/* ---------- Update ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.04, (now-last)/1000);
  last = now;
  tNow = now/1000;

  if(!paused){
    if(state==='play') update(dt);
    else if(state==='over') updateParticles(dt);
  }
  draw();
  requestAnimationFrame(frame);
}

function updateParticles(dt){
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt; p.life-=dt*1.6; p.r*=0.99; });
  particles = particles.filter(p=>p.life>0);
  if(bannerT>0) bannerT -= dt;
  if(themeFade>0) themeFade -= dt*1.2;
}

function update(dt){
  elapsed += dt;
  document.getElementById('time').textContent = Math.floor(elapsed);

  // soft end: a cheerful finish at the 2-minute mark keeps sessions short
  if(elapsed >= RUN_LIMIT_SECONDS){ endGame('done'); return; }

  // theme swap every ~60 s (visual only)
  themeT += dt;
  if(themeT >= THEME_SWAP_SECONDS){ themeT = 0; switchTheme(); }
  if(themeFade>0) themeFade -= dt*1.2;
  if(bannerT>0) bannerT -= dt;

  // ramp speed
  const r = Math.min(1, elapsed/60);
  speed = baseSpeed + (maxSpeed-baseSpeed) * r;
  spawnInterval = 2.6 - r*1.4;

  bgScroll += speed*dt;

  // lane glide
  if(targetLane !== lane){
    laneSwitchT -= dt;
    if(laneSwitchT<=0){ lane = targetLane; }
  }
  const laneTargetX = laneX(targetLane);
  player.x += (laneTargetX - player.x) * Math.min(1, dt*14);

  // jump physics
  if(player.jumping){
    player.vy += 2000*dt;
    player.y += player.vy*dt;
    if(player.y >= H*0.78){
      player.y = H*0.78; player.vy = 0; player.jumping=false;
    }
  }

  // spawn
  spawnT += dt;
  if(spawnT > spawnInterval){
    spawnT = 0;
    spawnObstacle();
  }

  // move world
  obstacles.forEach(o=> o.y += speed*dt );
  gems.forEach(g=>{ g.y += speed*dt; g.t += dt; });
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt; p.life-=dt*1.6; p.r*=0.99; });
  particles = particles.filter(p=>p.life>0);

  // collide
  const playerY = player.y;
  obstacles.forEach(o=>{
    if(o.dead) return;
    if(Math.abs(o.y - playerY) < 36){
      if(o.lane === lane || o.lane === targetLane){
        // a low obstacle is dodged by jumping; a high obstacle by ducking
        if(o.type==='low' && player.jumping) { /* safe */ }
        else if(o.type==='high' && player.ducking) { /* safe */ }
        else { o.dead=true; endGame('bump'); }
      }
    }
  });
  if(state !== 'play') return;
  gems.forEach(g=>{
    if(g.taken) return;
    if(Math.abs(g.y - playerY) < 30 && (g.lane===lane||g.lane===targetLane)){
      g.taken = true;
      gemsThisRun++;
      document.getElementById('gems').textContent = gemsThisRun;
      gemSound();
      for(let i=0;i<10;i++){
        particles.push({x:laneX(g.lane), y:g.y, vx:(Math.random()-.5)*260, vy:-Math.random()*220, r:4+Math.random()*4, color:`hsl(${Math.random()*360},90%,60%)`, life:1});
      }
    }
  });
  obstacles = obstacles.filter(o => o.y < H+100 && !o.dead);
  gems = gems.filter(g => g.y < H+100 && !g.taken);
}

function drawScene(th){
  drawSky(th);
  drawGround(th);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(themeFade > 0){
    drawScene(prevTheme);
    ctx.globalAlpha = Math.max(0, Math.min(1, 1-themeFade));
    drawScene(theme);
    ctx.globalAlpha = 1;
  } else {
    drawScene(theme);
  }
  // sort by y so further-back objects draw first
  const items = [...obstacles.map(o=>({y:o.y, draw:()=>drawObstacle(o)})),
                 ...gems.map(g=>({y:g.y, draw:()=>drawGem(g)}))];
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.draw());

  // player
  drawCritter(player.x, player.y, player.ducking, 0);
  drawParticles();

  // ground vignette
  const grd = ctx.createLinearGradient(0,H*0.42,0,H);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,0,0.18)');
  ctx.fillStyle=grd; ctx.fillRect(0,H*0.42,W,H);

  drawBanner();
}

requestAnimationFrame(frame);

/* iOS audio unlock on first touch */
document.addEventListener('pointerdown', ()=>{ ensureAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, {once:true});

/* Boot: load save data, signal Playables, mark ready to play */
(async function boot(){
  await bootSave();
  // First frame about to draw — notify YouTube
  requestAnimationFrame(()=>{
    YTGame.firstFrameReady();
    // We're interactable as soon as the menu overlay is up (which it already is)
    YTGame.gameReady();
  });
})();
</script>
